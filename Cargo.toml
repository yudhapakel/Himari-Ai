[package]
name = "himari-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = "0.19"
rand = "0.8"
regex = "1.10"
dirs = "5.0"
colored = "2.1"
urlencoding = "2.1"
crossterm = "0.29.0"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
